# Pipeline CI/CD
#  - push na dowolną gałąź: testy -> build obrazu -> publikacja w GHCR -> test obrazu
#  - push na main:          dodatkowo automatyczne wdrożenie na serwer AWS
#  - zawsze:                powiadomienie o wyniku na Telegram
name: CI/CD

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Testy i lint aplikacji
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testy jednostkowe (pytest)
        run: pytest -v

  iac:
    name: Walidacja Terraform i Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: ansible syntax-check
        run: |
          pip install ansible-core
          cd ansible && ansible-playbook -i localhost, site.yml --syntax-check

  build:
    name: Build i publikacja obrazu
    needs: [test, iac]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - name: Nazwa obrazu (małe litery)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Logowanie do GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagi obrazu
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build i push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test integracyjny opublikowanego obrazu
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          docker run -d --name smoke -p 8000:8000 "$IMAGE"
          curl -sf --retry 15 --retry-all-errors --retry-delay 2 http://localhost:8000/health
          VERSION=$(curl -sf http://localhost:8000/api/info | jq -r .version)
          echo "Wersja w obrazie: $VERSION"
          test "$VERSION" = "$GITHUB_SHA"
          curl -sf http://localhost:8000/metrics | grep -q http_requests_total
          docker rm -f smoke

  deploy:
    name: Wdrożenie na AWS
    needs: build
    # Tylko gałąź main i tylko gdy infrastruktura istnieje (zmienną DEPLOY_ENABLED ustawia scripts/setup-github.sh)
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit

  notify:
    name: Powiadomienie Telegram
    needs: [test, iac, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Treść wiadomości
        id: message
        env:
          TEST: ${{ needs.test.result }}
          IAC: ${{ needs.iac.result }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          URL: ${{ needs.deploy.outputs.url }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label() {
            case "$1" in
              success) echo "✅ sukces" ;;
              failure) echo "❌ błąd" ;;
              cancelled) echo "⚪ anulowane" ;;
              skipped) echo "⏭ pominięte" ;;
              *) echo "$1" ;;
            esac
          }

          if [[ "$TEST $IAC $BUILD $DEPLOY" == *failure* || "$TEST $IAC $BUILD $DEPLOY" == *cancelled* ]]; then
            HEADER="❌ Pipeline NIEUDANY"
          elif [ "$DEPLOY" = "success" ]; then
            HEADER="🚀 Wdrożono na produkcję: $URL"
          else
            HEADER="✅ Build udany"
          fi

          {
            echo "text<<EOT"
            printf '%s\n\nRepozytorium: %s\nGałąź: %s\nCommit: %s %s\nAutor: %s\n\nTesty: %s\nWalidacja IaC: %s\nBuild i publikacja: %s\nWdrożenie: %s\n\n%s\n' \
              "$HEADER" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$(echo "$COMMIT_MSG" | head -1)" "$GITHUB_ACTOR" \
              "$(label "$TEST")" "$(label "$IAC")" "$(label "$BUILD")" "$(label "$DEPLOY")" "$RUN_URL"
            echo "EOT"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: ${{ steps.message.outputs.text }}
