[defaults]
inventory = inventory.ini
remote_user = ubuntu
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
# Nowy serwer ma nieznany klucz hosta: akceptujemy go przy pierwszym połączeniu, potem jest weryfikowany
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=20
