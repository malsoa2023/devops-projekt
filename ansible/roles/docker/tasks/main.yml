- name: Dodaj oficjalne repozytorium Dockera
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  register: docker_repo

- name: Odśwież listę pakietów po dodaniu repozytorium
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 300
  when: docker_repo is changed

- name: Zainstaluj Docker Engine i Docker Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    lock_timeout: 300

- name: Uruchom Dockera i włącz start przy rozruchu
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Pozwól użytkownikowi ubuntu używać Dockera bez sudo
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
